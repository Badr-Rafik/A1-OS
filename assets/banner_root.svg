<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hospital Simulation banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <style>
      .title { font-family:'Segoe UI',Arial,sans-serif; font-weight:800; font-size:64px; fill:url(#accent); }
      .sub { font-family:'Segoe UI',Arial,sans-serif; font-size:22px; fill:#e2e8f0; letter-spacing:3px; }
      .small { font-family:'Segoe UI',Arial,sans-serif; font-size:17px; fill:#94a3b8; }
      .done { fill:#064e3b; stroke:#34d399; stroke-width:2.5; }
      .num { font-family:Consolas,'Courier New',monospace; font-weight:700; font-size:22px; text-anchor:middle; }
      .lab { font-family:'Segoe UI',Arial,sans-serif; font-size:14px; text-anchor:middle; }
      .on { fill:#ecfdf5; }
      .glow { animation:glow 2.4s ease-in-out infinite; }
      .g2 { animation-delay:0.8s; }
      .g3 { animation-delay:1.6s; }
      @keyframes glow { 0%,100% { opacity:1; } 50% { opacity:0.55; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <text x="60" y="125" class="title">Hospital</text>
  <text x="60" y="195" class="title">Simulation</text>
  <text x="64" y="240" class="sub">JAVA · THREADS &amp; SEMAPHORES</text>
  <text x="64" y="270" class="small">Patients · Doctors · Waiting room · Treatment rooms · Producer–Consumer</text>

  <!-- row 1 -->
  <g class="glow">
    <rect class="done" x="680" y="70" width="110" height="80" rx="12"/>
    <text class="num on" x="735" y="106">N</text><text class="lab on" x="735" y="132">Patients</text>
  </g>
  <g class="glow g2">
    <rect class="done" x="804" y="70" width="110" height="80" rx="12"/>
    <text class="num on" x="859" y="106">N</text><text class="lab on" x="859" y="132">Doctors</text>
  </g>
  <g class="glow g3">
    <rect class="done" x="928" y="70" width="110" height="80" rx="12"/>
    <text class="num on" x="983" y="106">N</text><text class="lab on" x="983" y="132">Seats</text>
  </g>
  <g class="glow">
    <rect class="done" x="1052" y="70" width="110" height="80" rx="12"/>
    <text class="num on" x="1107" y="106">2</text><text class="lab on" x="1107" y="132">Rooms</text>
  </g>

  <!-- row 2 -->
  <g class="glow g2">
    <rect class="done" x="680" y="170" width="110" height="80" rx="12"/>
    <text class="num on" x="735" y="206">3s</text><text class="lab on" x="735" y="232">Timeout</text>
  </g>
  <g class="glow g3">
    <rect class="done" x="804" y="170" width="110" height="80" rx="12"/>
    <text class="num on" x="859" y="206">1-5s</text><text class="lab on" x="859" y="232">Treatment</text>
  </g>
  <g class="glow">
    <rect class="done" x="928" y="170" width="110" height="80" rx="12"/>
    <text class="num on" x="983" y="206">5</text><text class="lab on" x="983" y="232">Semaphores</text>
  </g>
  <g class="glow g2">
    <rect class="done" x="1052" y="170" width="110" height="80" rx="12"/>
    <text class="num on" x="1107" y="206">7</text><text class="lab on" x="1107" y="232">Classes</text>
  </g>
</svg>
