<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Team: Kareem Ahmed, Badr, Adham, Abdelrahman, Malik" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="380" height="130" rx="22"/></clipPath>
    <style>
      .name { font-family:'Segoe UI',Arial,sans-serif; font-weight:800; font-size:30px; fill:#f8fafc; }
      .init { font-family:'Segoe UI',Arial,sans-serif; font-weight:800; font-size:28px; fill:#ffffff; text-anchor:middle; }
    </style>
  </defs>

  <!-- Kareem Ahmed -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="380" height="130" rx="22" fill="url(#bg)"/>
    <rect x="1.5" y="1.5" width="377" height="127" rx="21" fill="none" stroke="url(#accent)" stroke-width="3">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="3s" begin="0.0s" repeatCount="indefinite"/>
    </rect>
    <circle cx="70" cy="65" r="38" fill="url(#accent)"/>
    <text class="init" x="70" y="75">KA</text>
    <text class="name" x="125" y="75" style="font-size:30px">Kareem Ahmed</text>
    <g clip-path="url(#card)">
      <rect x="-200" y="-10" width="110" height="150" fill="url(#shine)" transform="skewX(-20)">
        <animate attributeName="x" values="-200;520" dur="2.6s" begin="0.0s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Badr -->
  <g transform="translate(410,20)">
    <rect x="0" y="0" width="380" height="130" rx="22" fill="url(#bg)"/>
    <rect x="1.5" y="1.5" width="377" height="127" rx="21" fill="none" stroke="url(#accent)" stroke-width="3">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="70" cy="65" r="38" fill="url(#accent)"/>
    <text class="init" x="70" y="75">BD</text>
    <text class="name" x="125" y="75" style="font-size:30px">Badr</text>
    <g clip-path="url(#card)">
      <rect x="-200" y="-10" width="110" height="150" fill="url(#shine)" transform="skewX(-20)">
        <animate attributeName="x" values="-200;520" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Adham -->
  <g transform="translate(800,20)">
    <rect x="0" y="0" width="380" height="130" rx="22" fill="url(#bg)"/>
    <rect x="1.5" y="1.5" width="377" height="127" rx="21" fill="none" stroke="url(#accent)" stroke-width="3">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="3s" begin="1.0s" repeatCount="indefinite"/>
    </rect>
    <circle cx="70" cy="65" r="38" fill="url(#accent)"/>
    <text class="init" x="70" y="75">AD</text>
    <text class="name" x="125" y="75" style="font-size:30px">Adham</text>
    <g clip-path="url(#card)">
      <rect x="-200" y="-10" width="110" height="150" fill="url(#shine)" transform="skewX(-20)">
        <animate attributeName="x" values="-200;520" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Abdelrahman -->
  <g transform="translate(215,170)">
    <rect x="0" y="0" width="380" height="130" rx="22" fill="url(#bg)"/>
    <rect x="1.5" y="1.5" width="377" height="127" rx="21" fill="none" stroke="url(#accent)" stroke-width="3">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="70" cy="65" r="38" fill="url(#accent)"/>
    <text class="init" x="70" y="75">AR</text>
    <text class="name" x="125" y="75" style="font-size:30px">Abdelrahman</text>
    <g clip-path="url(#card)">
      <rect x="-200" y="-10" width="110" height="150" fill="url(#shine)" transform="skewX(-20)">
        <animate attributeName="x" values="-200;520" dur="2.6s" begin="1.2000000000000002s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Malik -->
  <g transform="translate(605,170)">
    <rect x="0" y="0" width="380" height="130" rx="22" fill="url(#bg)"/>
    <rect x="1.5" y="1.5" width="377" height="127" rx="21" fill="none" stroke="url(#accent)" stroke-width="3">
      <animate attributeName="stroke-opacity" values="1;0.35;1" dur="3s" begin="2.0s" repeatCount="indefinite"/>
    </rect>
    <circle cx="70" cy="65" r="38" fill="url(#accent)"/>
    <text class="init" x="70" y="75">ML</text>
    <text class="name" x="125" y="75" style="font-size:30px">Malik</text>
    <g clip-path="url(#card)">
      <rect x="-200" y="-10" width="110" height="150" fill="url(#shine)" transform="skewX(-20)">
        <animate attributeName="x" values="-200;520" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
